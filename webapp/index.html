<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="WaveFlow is your private, self-hosted music library."
    />
    <!-- Wave green, the brand's own colour, as the logo kit's head snippet
         sets it (design/logo/web/ in InstaZDLL/WaveFlow). -->
    <meta name="theme-color" content="#10B981" />
    <!-- Both icons come from the logo kit unchanged, and both carry its small
         drawing, the heavier stroke the guide asks for below 24px. The `.ico`
         first, sized, for the browsers that read nothing else; the SVG after,
         which every browser that understands it prefers. Declaring them also
         stops the probing: with no icon named, a browser asks for
         /favicon.ico on its own, and when no build shipped one it asked again
         and again — sixty-six times in fifty-one seconds on a real session. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable on a phone (RFC-022 decision 4). The manifest names the
         icons Android and desktop browsers use; iOS reads its home-screen icon
         from this tag instead. The service worker, /sw.js, keeps this shell
         and the tracks kept for offline, and never an API response. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WaveFlow" />
    <title>WaveFlow</title>
    <!-- Inline, and only what the first screen needs. The stylesheet is a
         separate request of about 30 kB, and a splash that waited for it would
         paint unstyled first — which is the thing it exists to prevent.

         The background is `#101311` because that is what `--ambient-bg`
         holds in the stylesheet, before `design-tokens/apply.ts` replaces it
         at mount. So this screen matches the page underneath it exactly and
         introduces no flash of its own. A reader on the light theme does see
         dark until the tokens land, but that is already true of the page and
         is not this screen's doing. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #101311;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      /* `pointer-events` as well as opacity, because the element is still
         there for the length of the fade — and under
         `prefers-reduced-motion` it is invisible the instant it is marked,
         with the whole 180ms still to run. A transparent layer over the
         viewport goes on taking every click aimed at the page beneath it. */
      #splash[data-leaving="true"] {
        opacity: 0;
        pointer-events: none;
      }
      /* Still. The mark used to breathe here, and the brand guide rules a
         pulsing logo out with its gradients and shadows. */
      #splash img {
        width: 5.5rem;
        height: 5.5rem;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- The symbol, in mint, because this screen is always the app's dark
         background and mint is the guide's colour on dark. The file is the
         logo kit's master, copied unchanged, as every brand file under
         `public/brand/` is. Inlining the path here would be quicker by one
         small request and would start a second copy of the mark that could
         drift from the kit — the defect this screen's own issue was filed
         about.

         `aria-hidden`: the mark says nothing a reader needs, and three
         hundred milliseconds is below the span where announcing a wait helps
         rather than interrupts. A wait long enough to be worth saying is
         `Waiting`'s, inside the application, where it carries
         `role="status"`. -->
    <div id="splash" aria-hidden="true">
      <img src="/brand/waveflow-symbol-mint.svg" alt="" width="88" height="88" />
    </div>
    <div id="root"></div>
    <!-- The screen must not outlive a client that never arrives.
         `dismissSplash` is the ordinary way out and it runs from the bundle,
         so a bundle that fails to parse, or throws before React's first
         commit, would leave the mark over the viewport for as long as
         the tab stayed open — worse than a blank page, because a blank page
         at least looks broken instead of looking like it is working.

         Ten seconds: past any load this is meant to dress, and short enough
         that a client which is not coming becomes visible. What it reveals is
         an empty `#root`, which is exactly what this page showed before the
         screen existed — the ceiling restores the old failure rather than
         inventing a new one.

         A `window.onerror` handler would notice sooner, and is not used: any
         unrelated non-fatal error would then take the screen away early, and
         the ceiling already covers the case it would catch.

         Inline on purpose. A fallback for the bundle cannot live in the
         bundle. -->
    <script>
      setTimeout(function () {
        var splash = document.getElementById("splash");
        if (splash && !splash.dataset.leaving) splash.remove();
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
