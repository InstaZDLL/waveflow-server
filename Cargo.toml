[package]
name = "waveflow-server"
version = "0.0.0"
description = "Self-hosted backend for WaveFlow: multi-device sync, web playback, public shareable playlists."
authors = ["InstaZDLL <github.105mh@8shield.net>"]
edition = "2021"
# Matches sqlx 0.9's documented MSRV — any older toolchain fails to
# resolve the dependency anyway, declaring it here just turns the
# error into a single clear message instead of a wall of rustc output.
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/InstaZDLL/waveflow-server"
homepage = "https://waveflow.app"

# Dependencies are added one at a time as the phases in RFC-001 land,
# so the workspace stays cheap to compile during the scaffolding
# window. 1.b.1 added axum; 1.b.2 adds sqlx + waveflow-core; the
# OpenAPI spec (utoipa) lands in 1.b.3.

[dependencies]
# waveflow-core ships the repository traits + Postgres implementations
# (RFC-001 §6.5). Pinned by rev rather than branch so the server's
# build is reproducible — bump the rev in tree when picking up a new
# core release. `default-features = false` because core's
# default-feature set is empty; we only want the `postgres` feature.
waveflow-core = { git = "https://github.com/InstaZDLL/WaveFlow", rev = "25b9ada6c2d5404cd40343a8fda44a92bfb46968", default-features = false, features = ["postgres"] }

# Database. `runtime-tokio` matches our `#[tokio::main]` runtime;
# `postgres` is the driver; `macros` enables `query_as!`; `migrate`
# pulls in the migration runner used by `db::run_migrations`; and
# `tls-rustls` lets us connect to managed Postgres providers that
# mandate `sslmode=require` (Neon, Supabase, Prisma Accelerate, RDS).
# Pure-Rust rustls matches the convention reqwest uses elsewhere in
# the project — no OpenSSL system dep to ship in the container image.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "tls-rustls"] }

# Wall-clock timestamps for `created_at` / `last_used_at`. Same
# crate the desktop uses so a shared timestamp helper stays cheap.
chrono = "0.4"

# OpenAPI 3.1 spec generation. `utoipa-axum` exposes an
# `OpenApiRouter` that picks up every handler tagged with
# `#[utoipa::path]` so the spec stays in lockstep with the routes
# without a parallel paths(...) list to maintain. `utoipa-scalar`
# serves the Scalar API reference (Stripe-style — modern, ~500 KB
# bundle, dark mode, integrated search) from `/reference`.
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# HTTP layer. axum 0.8 is the line current for Tokio 1.45+ — the same
# generation used by the desktop's reqwest 0.12, so we're not pulling
# two competing hyper trees once `waveflow-core` lands as a dependency
# in 1.b.2.
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "util"] }

# Structured logging. `tracing-subscriber` reads `RUST_LOG`; the binary
# wires JSON output when `WAVEFLOW_LOG_FORMAT=json` is set (CI / prod),
# pretty output otherwise (dev).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Loaded at boot from `.env` if present, else env vars only. dotenvy is
# the maintained successor to `dotenv` (the original crate was archived
# in 2020); it stays inert in release builds where there's no `.env`.
dotenvy = "0.15"

# Typed serialization for the JSON responses; same crate / version pair
# the desktop app uses so a future shared response type stays cheap.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT verification against Better Auth's JWKS endpoint (RFC-001 §6.6).
# `jsonwebtoken` 9 covers RS256 / ES256 signature verification, exp /
# nbf clock checks and the `jwk` / `jwk-set` types for parsing a JWKS
# document. The middleware that consumes this (1.d.1-PR3) caches the
# decoded keys keyed by `kid` so the per-request path stays a single
# RSA verify, no HTTP round-trip in the hot loop.
jsonwebtoken = "9"

# HTTP client for the JWKS fetcher. Already a dev-dep for the
# integration tests — promoted to runtime so the auth module can
# hit Better Auth's well-known endpoint. `rustls-tls` matches the
# convention used elsewhere in the project (no OpenSSL system dep).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error chaining at boundaries (main, Config::from_env, integration
# tests). Internal modules should prefer `thiserror`-typed errors
# once we have a domain richer than "boot failed"; anyhow's flexibility
# is what we want at the binary edge.
anyhow = "1"

# Typed errors for internal modules. The first consumer is
# `auth::AuthError` — the middleware needs to discriminate "bad
# header" from "unreachable JWKS" to pick the right HTTP status,
# which a stringly-typed `anyhow::Error` would muddle.
thiserror = "2"

[dev-dependencies]
# JWT auth tests sign a token with an RSA-2048 keypair generated at
# test time, expose the public half on a local mock JWKS endpoint
# (via axum), and assert the verifier's accept / reject paths. The
# RSA crate generates the keypair; `rand` seeds the OsRng wrapper
# the keygen needs; `base64` URL-encodes the `n` / `e` components
# the JWK Set advertises. All dev-only — production never generates
# keys, it only consumes the JWKS document.
rsa = "0.9"
rand = "0.8"
base64 = "0.22"

[profile.release]
# Match the desktop app's release profile so behaviour parity holds at
# the binary level. Single-codegen-unit + LTO trade compile time for
# smaller and faster binaries — fine for a server we deploy once per
# release.
codegen-units = 1
lto = "thin"
strip = "debuginfo"
