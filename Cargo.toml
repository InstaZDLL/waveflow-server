[package]
name = "waveflow-server"
version = "2.0.0-beta.0"
description = "Self-hosted music server with WaveFlow and Subsonic compatibility."
authors = ["InstaZDLL <github.105mh@8shield.net>"]
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/InstaZDLL/waveflow-server"
homepage = "https://waveflow.app"
# The PostgreSQL v1 integration tests stay in-tree as transition evidence but
# are intentionally not discovered by the v2 crate. They are removed with the
# final /api/v1 retirement at M4.
autotests = false

[features]
default = []
legacy-v1 = []

[dependencies]
anyhow = "1"
async-stream = "0.3"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
lofty = "0.24"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
waveflow-core = { git = "https://github.com/InstaZDLL/WaveFlow", rev = "d4c44eb5024a7b8e3aa42170c0ab5bd693788297", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[[test]]
name = "v2_foundations"
path = "tests/v2_foundations.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
