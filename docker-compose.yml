# Pulls the published image. To run your own build instead, uncomment `build`
# below — with it present Compose builds from this checkout rather than pulling,
# which is what a contributor wants and what an operator does not.
# The same image is on Docker Hub as `docker.io/instazdll/waveflow-server`, with
# the same tags and digest, for a host that pulls from there instead.
services:
  waveflow:
    image: ghcr.io/instazdll/waveflow-server:2.0.0-beta.1
    # build: .
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      WAVEFLOW_DATA_DIR: /data
      WAVEFLOW_BIND: 0.0.0.0:4533
      WAVEFLOW_PUBLIC_URL: ${WAVEFLOW_PUBLIC_URL:-}
      # The port above is published on every interface, so the first account
      # asks for a one-time setup token (from the release after 2.0.0-beta.1).
      # Leave this empty and the server writes one to /data/setup-token:
      #   docker compose exec waveflow cat /data/setup-token
      # or choose your own here, 16 characters at least.
      WAVEFLOW_SETUP_TOKEN: ${WAVEFLOW_SETUP_TOKEN:-}
    volumes:
      - waveflow-data:/data
      - type: bind
        source: ${WAVEFLOW_MUSIC_PATH:-./music}
        target: /music
        read_only: true

volumes:
  waveflow-data:
