version: 2

updates:
  # npm/Bun deps for the TanStack Start app. The `npm` ecosystem
  # covers Bun's `package.json` + `bun.lock` — Dependabot doesn't
  # have a dedicated Bun parser yet, but the npm resolver reads
  # the lockfile correctly.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/Zurich'
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - 'scope: deps'
    commit-message:
      prefix: chore
    groups:
      # Roll patch + minor bumps into one PR per week so the review
      # surface stays bounded. Majors stay individual — they're
      # likely to need code edits (cf. jsonwebtoken 9→10 on
      # waveflow-server).
      npm-patch-and-minor:
        update-types:
          - minor
          - patch
      # TanStack ecosystem bumps tend to land in lockstep across
      # @tanstack/react-router, @tanstack/react-start,
      # @tanstack/router-plugin etc. Group them so a coordinated
      # version doesn't surface as 5 individual PRs.
      tanstack:
        patterns:
          - '@tanstack/*'
    ignore:
      # Held back at 0.28.x — kysely 0.29 moved
      # `DEFAULT_MIGRATION_LOCK_TABLE` to the `kysely/migration`
      # subpath and Better Auth's bundled kysely-adapter still
      # imports it from the root export, so any 0.29.x bump breaks
      # `bun run build` with MISSING_EXPORT. Lift this ignore once
      # @better-auth/kysely-adapter ships a release that follows
      # the new import path (track better-auth/better-auth#XXXX).
      - dependency-name: kysely
        versions:
          - '>=0.29.0'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:10'
      timezone: 'Europe/Zurich'
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - 'scope: tooling'
    commit-message:
      prefix: chore
    groups:
      github-actions-all:
        patterns:
          - '*'
