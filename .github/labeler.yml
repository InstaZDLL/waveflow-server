# Path-based auto-labels for pull requests. Consumed by
# `actions/labeler` in `.github/workflows/label-pr.yml`. Keep the
# scopes coarse — fine-grained per-file rules become noise on a
# refactor that touches everything.
#
# Label naming mirrors the desktop's convention (`scope: foo` with a
# space, not `scope:foo`) so a contributor jumping between repos
# sees a consistent palette in the GitHub label sidebar.

# ─────────────────────────────────────────────────────────────
# Top-level halves of the monorepo. Most PRs touch one side or
# the other; a small minority that wire a contract change end up
# carrying both — that's a useful signal in the PR list.
# ─────────────────────────────────────────────────────────────

'scope: server':
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'src/**'
          - 'migrations-v2/**'
          - 'build.rs'
          - 'tests/**'

'scope: web':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/**'

# ─────────────────────────────────────────────────────────────
# Server-side fine scopes (inside src/).
# ─────────────────────────────────────────────────────────────

'scope: api':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/http.rs'
          - 'src/services.rs'
          - 'src/lib.rs'

'scope: db':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/database.rs'
          - 'src/catalog.rs'
          - 'migrations-v2/**'

'scope: auth':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/authentication.rs'
          - 'src/oauth.rs'
          - 'src/security.rs'

'scope: subsonic':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/subsonic.rs'
          - 'docs/subsonic-compatibility.md'

'scope: streaming':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/media.rs'
          - 'src/stream_ticket.rs'

'scope: scanner':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/scanner.rs'

# ─────────────────────────────────────────────────────────────
# Web fine scopes (inside webapp/src/).
# ─────────────────────────────────────────────────────────────

'scope: routes':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/src/main.tsx'

'scope: components':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/src/pages.tsx'

'scope: design-tokens':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/src/design-tokens/**'

# ─────────────────────────────────────────────────────────────
# Cross-cutting.
# ─────────────────────────────────────────────────────────────

'scope: tooling':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'webapp/vite.config.ts'
          - 'webapp/vitest.config.ts'
          - 'webapp/tsconfig.json'

'scope: deps':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/biome.json'
          - 'webapp/package.json'
          - 'webapp/bun.lock'
          - 'Cargo.toml'
          - 'Cargo.lock'

'scope: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
