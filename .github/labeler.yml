# Path-based auto-labels for pull requests. Consumed by
# `actions/labeler` in `.github/workflows/label-pr.yml`. Keep the
# scopes coarse — fine-grained per-file rules become noise on a
# refactor that touches everything.
#
# Label naming mirrors the desktop's convention (`scope: foo` with a
# space, not `scope:foo`) so a contributor jumping between repos
# sees a consistent palette in the GitHub label sidebar.

'scope: routes':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/routes/**'

'scope: components':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/**'

'scope: api':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/routes/api/**'
          - 'src/server/**'

'scope: auth':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/auth/**'
          - 'src/lib/auth.ts'
          - 'src/lib/auth-client.ts'
          - 'src/routes/sign-in/**'
          - 'src/routes/sign-up/**'
          - 'src/routes/api/auth/**'

'scope: tooling':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.husky/**'
          - 'eslint.config.js'
          - '.prettierrc.json'
          - '.commitlintrc.cjs'
          - 'vite.config.ts'
          - 'vitest.config.ts'
          - 'tsconfig.json'

'scope: deps':
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'bun.lock'

'scope: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
