# Path-based auto-labels for pull requests. Consumed by
# `actions/labeler` in `.github/workflows/label-pr.yml`. Keep the
# scopes coarse — fine-grained per-file rules become noise on a
# refactor that touches everything.
#
# Label naming mirrors the desktop's convention (`scope: foo` with a
# space, not `scope:foo`) so a contributor jumping between repos
# sees a consistent palette in the GitHub label sidebar.

# ─────────────────────────────────────────────────────────────
# Top-level halves of the monorepo. Most PRs touch one side or
# the other; a small minority that wire a contract change end up
# carrying both — that's a useful signal in the PR list.
# ─────────────────────────────────────────────────────────────

'scope: server':
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'src/**'
          - 'migrations/**'
          - 'tests/**'

'scope: web':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/**'

# ─────────────────────────────────────────────────────────────
# Server-side fine scopes (inside src/).
# ─────────────────────────────────────────────────────────────

'scope: api':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/api/**'
          - 'src/lib.rs'

'scope: db':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/db.rs'
          - 'src/db/**'
          - 'migrations/**'

'scope: auth':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/auth.rs'
          - 'src/middleware.rs'
          # `sign-in.tsx` / `sign-up.tsx` are FILES at the root of
          # `webapp/src/`, not directories. minimatch's
          # `{a,b}` brace expansion gives us a clean union of the
          # two real shapes: the literal `.tsx` file today and a
          # future `sign-in/` subtree (e.g. `sign-in.callback.tsx`,
          # `sign-in/index.tsx`). The earlier `{,/**}` shape only
          # produced `sign-in` (no extension, doesn't exist) and
          # `sign-in/**`, missing the actual `.tsx` file.

'scope: sync':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/api/sync.rs'
          - 'src/apply.rs'
          - 'src/apply/**'

'scope: streaming':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/api/stream.rs'
          - 'src/stream_token.rs'

'scope: artwork':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/api/artwork.rs'
          - 'src/artwork_pipeline.rs'
          - 'src/artwork_jobs.rs'
          - 'src/storage.rs'

# ─────────────────────────────────────────────────────────────
# Web fine scopes (inside webapp/src/).
# ─────────────────────────────────────────────────────────────

'scope: routes':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/src/main.tsx'

'scope: components':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/src/pages.tsx'

'scope: design-tokens':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/src/design-tokens/**'

# ─────────────────────────────────────────────────────────────
# Cross-cutting.
# ─────────────────────────────────────────────────────────────

'scope: tooling':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'webapp/vite.config.ts'
          - 'webapp/vitest.config.ts'
          - 'webapp/tsconfig.json'

'scope: deps':
  - changed-files:
      - any-glob-to-any-file:
          - 'webapp/biome.json'
          - 'webapp/package.json'
          - 'webapp/bun.lock'
          - 'Cargo.toml'
          - 'Cargo.lock'

'scope: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
