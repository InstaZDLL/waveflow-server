name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations-v2/**"
      - "tests/**"
      - ".github/workflows/**"
  # Every pull request, with no path filter. The ruleset on `main` requires a
  # CodeQL result, and a filtered run never comes for a branch that touches
  # only `webapp/` or `docs/`: such a PR finished green and still BLOCKED,
  # waiting for an analysis nothing would start. On those the analysis finds
  # nothing new, which is the answer the requirement is waiting for.
  pull_request:
    branches: [main]
  schedule:
    - cron: "34 7 * * 4"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `actions` analysis runs the CodeQL queries that catch script-
  # injection patterns in workflow files themselves. Always-on, cheap.
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:actions"

  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Pre-fetch the full dep graph so CodeQL's internal `cargo metadata`
      # invocations resolve every transitive crate without hitting the
      # registry mid-extraction. The Rust extractor is preview-only and
      # rejects build-mode=manual, so this is the main lever we have to
      # push call-target resolution above the 50 % threshold.
      - name: cargo fetch
        run: cargo fetch --locked

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - 'target/**'

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:rust"
