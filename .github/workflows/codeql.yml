name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/**"
  schedule:
    - cron: "34 7 * * 4"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `actions` analysis runs the CodeQL queries that catch script-
  # injection patterns in workflow files themselves. Always-on, cheap.
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Pre-fetch the full dep graph so CodeQL's internal `cargo metadata`
      # invocations resolve every transitive crate without hitting the
      # registry mid-extraction. The Rust extractor is preview-only and
      # rejects build-mode=manual, so this is the main lever we have to
      # push call-target resolution above the 50 % threshold.
      - name: cargo fetch
        run: cargo fetch --locked

      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - 'target/**'

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
