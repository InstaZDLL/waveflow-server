name: Auto-label PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  scope:
    name: Apply scope labels from changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Apply scope:* labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  type:
    name: Apply type:* labels from the PR title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Parse Conventional Commits prefix
        uses: bcoe/conventional-release-labels@v1
        with:
          type_labels: |
            {
              "feat": "type:feature",
              "fix": "type:fix",
              "chore": "type:chore",
              "docs": "type:docs",
              "refactor": "type:refactor",
              "test": "type:test",
              "style": "type:style",
              "perf": "type:perf",
              "ci": "type:ci",
              "build": "type:build",
              "revert": "type:revert"
            }

  size:
    name: Apply size:* labels from diff line count
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Apply size:xs/s/m/l/xl
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size:xs'
          xs_max_size: 10
          s_label: 'size:s'
          s_max_size: 100
          m_label: 'size:m'
          m_max_size: 500
          l_label: 'size:l'
          l_max_size: 1000
          xl_label: 'size:xl'
          message_if_xl: ''
          fail_if_xl: false
