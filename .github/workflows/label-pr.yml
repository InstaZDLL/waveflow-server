name: Auto-label PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

# Default workflow permissions are the minimal read-only set; each job
# escalates only what it needs. Without per-job overrides every step
# in the workflow would inherit `pull-requests: write` even though
# only the labeler actions use it.
permissions:
  contents: read

# Re-run on a fresh push collapses to one run per PR. Without this, a
# busy contributor rebasing five times in a minute would queue five
# overlapping labeler runs that race against the same PR — the last
# write wins anyway, so the prior four are wasted Actions minutes.
concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Apply scope labels from changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply scope:* labels
        # Pinned to the v6.1.0 commit SHA. `pull_request_target` runs
        # in the base-repo context with write tokens, so a mutable
        # `@v6` tag would let a compromised upstream rewrite the tag
        # and exfiltrate that token. Same rule for every action below.
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  type:
    name: Apply type:* labels from the PR title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Parse Conventional Commits prefix
        uses: bcoe/conventional-release-labels@886f696738527c7be444262c327c89436dfb95a8 # v1.3.1
        with:
          # Names mirror the desktop's `type: feat` convention
          # (space after `:`, short `feat` not `feature`). Aligns
          # the palette across the WaveFlow repos so a contributor
          # browsing both sees consistent chips in the GitHub UI.
          type_labels: |
            {
              "feat": "type: feat",
              "fix": "type: fix",
              "chore": "type: chore",
              "docs": "type: docs",
              "refactor": "type: refactor",
              "test": "type: test",
              "style": "type: style",
              "perf": "type: perf",
              "ci": "type: ci",
              "build": "type: build",
              "revert": "type: revert"
            }

  size:
    name: Apply size:* labels from diff line count
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply size:xs/s/m/l/xl
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1.10.4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same naming convention as `type: *` and `scope: *` —
          # space after the colon, short tokens.
          xs_label: 'size: xs'
          xs_max_size: 10
          s_label: 'size: s'
          s_max_size: 100
          m_label: 'size: m'
          m_max_size: 500
          l_label: 'size: l'
          l_max_size: 1000
          xl_label: 'size: xl'
          message_if_xl: ''
          fail_if_xl: false
