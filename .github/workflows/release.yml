name: Release

# Publishes a tag: the container image, the standalone archives
# (standalone.yml), then the GitHub release that announces both. Each archive
# carries the server and its own FFmpeg, so it needs nothing from the host, and
# the image stays what a server room installs from.
#
# The image's tags and the release page wait for the archives, so a tag whose
# archives failed announces nothing, and a retry finds nothing half done.
#
# A version carrying a pre-release suffix is marked as one in both places: the
# image floats as `beta` rather than `latest`, and the release wears the
# pre-release badge. Same rule as the desktop repository.
#
# The image goes to two registries, GHCR and Docker Hub, from one build: each
# architecture is pushed to both by digest, and one manifest list is written
# under every tag in both. A pull from either therefore resolves to the same
# digest — two builds would have produced two images that only share a name.
# Docker Hub is reached with the `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN`
# repository secrets; without them the build stops at its login rather than
# publishing to one registry and announcing two.
#
# The Windows executables in the archives are signed with the certificate in the
# `SIGNTOOL_PFX_BASE64` (the PFX, in base64) and `SIGNTOOL_PFX_PASSWORD` repository
# secrets. Without them `standalone.yml` stops before it builds an archive, and the
# image's tags and the release page, which wait for it, are never written; the
# image's own build still runs. The certificate is self-signed, so Windows still
# warns: §6 of docs/plans/standalone-download-plan.md says what it gives and what
# not.
#
# The tag is the source of truth for the version. `Cargo.toml` is not read
# here — a tag that disagrees with it would produce an image labelled one way
# and reporting itself another, so the two are checked against each other
# before anything is built.
#
# Once the release is out, `mirror` copies its files onto the R2 bucket behind
# download.waveflow.app and records the release on the GitLab backup, so losing
# this repository loses neither. `.gitlab-ci.yml` is this file's standby twin,
# and the release logic both run is in scripts/release/
# (docs/guides/releasing.md).

on:
  push:
    tags:
      - "v*"
  # Lets a failed publish be retried against the same tag without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.0.0-beta.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # `github.ref_name` rather than `github.ref`: a dispatch passes the bare tag,
  # so a push that spells it `refs/tags/v1.2.3` would land in a different group
  # and run alongside the retry it is meant to be serialized against.
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Docker Hub is spelled out rather than derived from `github.repository`:
  # the GitHub owner and the Docker Hub namespace are two accounts that only
  # happen to share a name. Lowercase, which Docker Hub requires as GHCR does.
  DOCKERHUB_IMAGE: docker.io/instazdll/waveflow-server

jobs:
  # Cheap, and it runs before any build minute is spent: a tag that does not
  # match the crate version is a mistake worth catching at second zero rather
  # than after two architectures have compiled.
  verify:
    name: Verify the tag matches the crate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      # A dispatch passes the bare tag, which a branch of the same name would
      # win over; spelled out as a tag ref, every checkout here is the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          tag_version="${tag#v}"
          # Same bounded form as the MSRV job: whitespace-tolerant, and
          # stopped at the closing quote, so a trailing comment cannot join
          # the version and make a correct tag look like a mismatch.
          crate_version="$(sed -n '/^\[package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag_version crate=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $tag declares $tag_version but Cargo.toml says $crate_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      # A stable release is announced with notes written for the people who
      # install it, in docs/releases/<tag>.md, as the desktop and QuickPlay
      # repositories do. Checked here, before any build minute is spent: a
      # release page made only of a list of merged pull requests is a release
      # nobody can read. A pre-release may still go without them.
      - name: Check the release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "${TAG#v}" in
            *-*) exit 0 ;;
          esac
          if [ ! -s "docs/releases/$TAG.md" ]; then
            echo "::error::docs/releases/$TAG.md is missing: a stable release needs its notes"
            exit 1
          fi

      # `github.repository` keeps the owner's casing and GHCR refuses an
      # uppercase path outright — the whole publish failed on it. Folded
      # once, here, rather than in each of the three jobs that need it.
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "image=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # After `verify`, like the image's build, and beside it. Named one by one rather
  # than `secrets: inherit`, so that file holds these two and not the registry
  # tokens. The README in each archive says what to click past.
  standalone:
    name: Standalone
    needs: verify
    uses: ./.github/workflows/standalone.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      SIGNTOOL_PFX_BASE64: ${{ secrets.SIGNTOOL_PFX_BASE64 }}
      SIGNTOOL_PFX_PASSWORD: ${{ secrets.SIGNTOOL_PFX_PASSWORD }}

  # Built on native runners rather than under QEMU. A Rust release build
  # emulated for arm64 takes hours; GitHub's arm64 runners are free for public
  # repositories and take the same time as the amd64 ones. Each runner pushes
  # by digest only, and the manifest below joins them into one tag.
  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed by digest; the tags are attached by the merge job. Pushing a
          # tag from each runner would leave whichever finished last as the
          # whole image rather than one architecture of it.
          #
          # Both names in one output, quoted because the comma between them
          # would otherwise end the `name` field: one build, so one digest,
          # pushed to each registry.
          outputs: type=image,"name=${{ needs.verify.outputs.image }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Named without the `sha256:` prefix, because the manifest job puts it
      # back: keeping it here would ask the registry for `sha256:sha256:…`.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the manifest
    needs: [verify, build, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The run's own group is per tag, but `beta` and `latest` are shared by
    # every tag: two releases publishing at once could interleave their
    # writes and leave the floating tag on one version in GHCR and another on
    # Docker Hub. Only this job writes tags, so only this job is serialized;
    # the builds still run side by side. `queue: max` keeps every waiting
    # publish in line: by default GitHub keeps only one, and a third release
    # arriving meanwhile would cancel the second's publish outright.
    concurrency:
      group: release-floating-tags
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` is deliberately absent. It is a pre-release: a reader who
      # pulls `latest` should get a stable build or nothing, never a beta they
      # did not ask for. The floating tag for this line is `beta`.
      #
      # One `imagetools create` writes the manifest list under every tag in
      # both registries, so the list itself is the same object everywhere.
      # Its sources are named in GHCR only; the build pushed each architecture
      # to Docker Hub too, so nothing has to cross between the registries.
      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          version="${{ needs.verify.outputs.version }}"
          image="${{ needs.verify.outputs.image }}"
          hub_image="${{ env.DOCKERHUB_IMAGE }}"
          case "$version" in
            *-*) extra="beta" ;;
            *) extra="latest" ;;
          esac
          refs=()
          for digest in *; do
            [ -e "$digest" ] || continue
            refs+=("$image@sha256:$digest")
          done
          # A manifest built from an empty list would publish the tag against
          # nothing, and the failure would only surface at someone's `docker pull`.
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no digests were collected; nothing to publish"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$image:$version" \
            --tag "$image:$extra" \
            --tag "$hub_image:$version" \
            --tag "$hub_image:$extra" \
            "${refs[@]}"
          docker buildx imagetools inspect "$image:$version"
          # Read back rather than assumed: the promise is that both registries
          # answer the same digest, and a mismatch is a failed release.
          ghcr_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$version")"
          hub_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$hub_image:$version")"
          echo "ghcr=$ghcr_digest hub=$hub_digest"
          if [ "$ghcr_digest" != "$hub_digest" ]; then
            echo "::error::GHCR answers $ghcr_digest but Docker Hub answers $hub_digest"
            exit 1
          fi

  # The GitHub release comes last, once the image and the archives it announces
  # exist. A release page whose pull command 404s is worse than no page.
  github-release:
    name: Publish the GitHub release
    needs: [verify, publish, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The notes, when there are some, are read from the tag itself, so the
      # page says what was released rather than what `main` says today.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # The release scripts come from the commit this workflow runs from, not
      # from the tag: a retried tag older than scripts/release/ has none, and a
      # missing script must not read as a release without notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-release
          path: release-assets

      # A pre-release suffix marks the release as one on GitHub, the same rule
      # the desktop repository uses. The badge is what keeps
      # `releases/latest` from resolving to a beta, and what tells a watcher
      # or a packager not to offer it.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.verify.outputs.image }}
          HUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          # A pre-release keeps the list of merged pull requests that
          # `--generate-notes` appends, whether or not it has written notes, as
          # every beta has had. A stable release with notes goes without it:
          # its notes link the changelog, and the list since the last stable
          # tag runs to hundreds of lines.
          case "$VERSION" in
            *-*) release_flag="--prerelease" ; generate="--generate-notes" ;;
            *)   release_flag="--latest"     ; generate=""                 ;;
          esac

          # Written notes come first, when the tag carries them; the downloads
          # and the pull commands follow, so a reader who scrolls past the prose
          # still finds them. Without notes (the script exits 10), the generated
          # list is all the page has. The script is shared with .gitlab-ci.yml,
          # which points the same table at the R2 copy.
          status=0
          sh .release-tools/scripts/release/release-notes.sh "$TAG" \
            "https://github.com/$GH_REPO/releases/download/$TAG" \
            "$IMAGE" "${HUB_IMAGE#docker.io/}" > notes.md || status=$?
          case "$status" in
            0) ;;
            10) generate="--generate-notes" ;;
            *) exit "$status" ;;
          esac

          # A release that already exists keeps its body. It was written once,
          # with the changelog appended for a beta, and re-applying our half
          # alone would replace the whole thing — a retry would silently delete
          # what it is not meant to touch. Only the flag is re-asserted, and the
          # assets replaced, since a retry rebuilt them and SHA256SUMS with them.
          #
          # Given assets, `gh release create` uploads them to a draft and only
          # then publishes it, so nobody sees the page without its downloads.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" $release_flag
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --notes-file notes.md \
              $generate \
              --verify-tag \
              $release_flag
          fi

  # The second home of what was just released, for the day this repository or
  # its account stops answering (docs/guides/releasing.md): the files on the
  # Cloudflare R2 bucket behind download.waveflow.app, under
  # server/releases/<tag>/, and a release on the GitLab backup linking there,
  # with the page GitHub now shows. The code and the tag reach GitLab through
  # mirror-gitlab.yml, as soon as the tag is pushed.
  #
  # Last and on its own, so nothing here can hold back the GitHub release. With
  # none of the R2 secrets the job says so and stops; with some of them it
  # fails, a half-configured mirror being a mistake. Without GITLAB_API_TOKEN
  # the files are still mirrored and only the GitLab page is skipped. A retry
  # re-uploads the same names and leaves an existing GitLab page as it is.
  mirror:
    name: Mirror to R2 and GitLab
    needs: [verify, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One at a time across tags: each reads a channel manifest before writing
    # it (RFC-028), and two interleaved would let the older version win.
    # `queue: max` keeps every waiting run instead of only the last.
    concurrency:
      group: r2-channel-manifests
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    # Each secret is given to the steps that use it, not to the whole job.
    env:
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://download.waveflow.app' }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Nothing of the tag is read here: only the scripts of this workflow's
      # commit, which a retried tag older than them would not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/release
          persist-credentials: false

      - id: r2
        name: Check the R2 secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          state="$(sh scripts/release/publish-r2.sh --check)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = absent ]; then
            echo "::notice::no R2 secret is set: $TAG is not mirrored (docs/guides/releasing.md)"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.r2.outputs.state == 'configured'
        with:
          name: standalone-release
          path: release-assets

      # The page as GitHub shows it, generated list and later edits included,
      # with its download links turned to the R2 copy: on the day GitHub is
      # gone, those are the ones that still answer. Kept on R2 beside the files
      # and given to GitLab below. Read into a file before `sed` touches it:
      # this shell has no pipefail, and a failed read would pass as a blank page.
      - name: Write the release page
        if: steps.r2.outputs.state == 'configured'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json body --jq .body > github-body.md
          [ -s github-body.md ] || { echo "::error::the GitHub release of $TAG has no body"; exit 1; }
          base="${R2_PUBLIC_URL%/}/server/releases/$TAG"
          from="https://github.com/$GH_REPO/releases/download/$TAG"
          # A literal replacement, both sides quoted: `sed` would read the
          # tag's dots as any character and an `&` in the address as the match.
          # The `x` keeps the trailing newlines command substitution would drop.
          body="$(cat github-body.md; printf x)"
          body="${body%x}"
          {
            printf '_Mirrored from the GitHub release %s; the downloads are served from %s._\n\n' "$TAG" "${R2_PUBLIC_URL%/}"
            printf '%s' "${body//"$from"/"$base"}"
          } > release-notes.md

      - name: Copy the files to R2
        if: steps.r2.outputs.state == 'configured'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_PAGE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}
        run: sh scripts/release/publish-r2.sh release-assets "$TAG" release-notes.md

      - name: Create the GitLab release
        if: steps.r2.outputs.state == 'configured'
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT || 'waveflow-groupe/waveflow-server' }}
        run: |
          if [ -z "$GITLAB_API_TOKEN" ]; then
            echo "::notice::GITLAB_API_TOKEN is not set: the GitLab release of $TAG is skipped"
            exit 0
          fi
          python3 scripts/release/gitlab-release.py "$TAG" release-notes.md release-assets \
            "${R2_PUBLIC_URL%/}/server/releases/$TAG"
