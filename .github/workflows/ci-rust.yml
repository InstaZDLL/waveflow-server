name: CI (Rust)

# Server-side Rust CI. Triggered on changes to Cargo / migrations /
# src / tests / its own workflow file — never on web/-only edits.
# A diff that touches BOTH halves of the monorepo runs both this
# workflow and ci-web.yml.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "migrations-v2/**"
      - "tests/**"
      # rust_embed compiles the client into the binary, so a webapp change
      # changes the Rust build.
      - "webapp/**"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "migrations-v2/**"
      - "tests/**"
      # rust_embed compiles the client into the binary, so a webapp change
      # changes the Rust build.
      - "webapp/**"
      - ".github/workflows/ci-rust.yml"

permissions:
  contents: read

# Cancel in-progress runs for the same PR or branch when a new commit lands.
concurrency:
  group: ci-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SQLite v2 tests create their own temporary data directories.
  linux:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The suite boots a real MediaService, which refuses to start without
      # ffmpeg and ffprobe, so every integration test needs them present.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --all-features

      - name: cargo test
        run: cargo test --all-features

  # The self-contained SQLite suite also runs on Windows because v2 is
  # intentionally a portable single-binary server.
  windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # choco exits 0 even when the community feed answers 503, so a failed
      # install used to surface five minutes later as nineteen tests panicking
      # on "ffmpeg: program not found". Retry the transient failure, then prove
      # both binaries are callable so this step fails where the cause is.
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PATH = "$env:PATH;$env:ProgramData\chocolatey\bin"
          foreach ($attempt in 1..3) {
            choco install ffmpeg --yes --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "::warning::FFmpeg install attempt $attempt did not produce a binary; retrying."
            Start-Sleep -Seconds 20
          }
          $ErrorActionPreference = 'Stop'
          ffmpeg -version
          ffprobe -version

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --all-features

      - name: cargo test
        run: cargo test --all-features
