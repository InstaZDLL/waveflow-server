name: CI (Web)

# Embedded web client CI, rooted in `webapp/`.
#
# It validates the client build directly, which nothing else does. build.rs
# only substitutes a placeholder when `webapp/dist/index.html` is absent: a
# directory left over from an earlier build is embedded as-is. Either way the
# Rust build succeeds, so without this job a broken or stale client would ship
# inside a binary that looks healthy.
#
# The superseded `web/` front end is deliberately not covered: it is not built,
# served or tested, and gating merges on a dead surface would be noise.

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp

jobs:
  lint-typecheck-build-test:
    name: Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # `actions/checkout` shallow-clones by default; fine for
          # this job — we don't grep git history.
          fetch-depth: 1
          # Drop the GITHUB_TOKEN from .git/config after checkout —
          # nothing else in this job pushes or makes authenticated
          # git calls, so leaving the token attached would just be
          # extra blast radius for a compromised step. Matches the
          # rest of the repo's checkout posture (rust matrix +
          # codeql).
          persist-credentials: false

      - name: Install Bun
        # Pinned to the v2.2.0 commit SHA. `pull_request` runs with a
        # read-only token but CodeQL's actions/unpinned-tag rule
        # treats every third-party action as supply-chain surface, so
        # we use the same hash-pinned posture the rest of the repo's
        # workflows already follow.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        # `--frozen-lockfile` makes a CI bun.lock drift fail loud
        # instead of silently regenerating against the registry.
        run: bun install --frozen-lockfile

      # `bun run build` typechecks before bundling, so this covers both.
      - name: Build
        run: bun run build

      # Covers the redirect guards that keep the consent screen and the
      # post-login hop from navigating to attacker-supplied targets.
      - name: Test
        run: bun run test
