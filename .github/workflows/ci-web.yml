name: CI (Web)

# Web client CI. Triggered only on web/** changes (plus this
# workflow file). Mirrors the workflow that lived at
# `web/.github/workflows/ci.yml` before the monorepo merge but with
# every shell step rooted in `web/` and the trigger gated by path.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  lint-typecheck-build-test:
    name: Lint / Typecheck / Build / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # `actions/checkout` shallow-clones by default; fine for
          # this job — we don't grep git history.
          fetch-depth: 1
          # Drop the GITHUB_TOKEN from .git/config after checkout —
          # nothing else in this job pushes or makes authenticated
          # git calls, so leaving the token attached would just be
          # extra blast radius for a compromised step. Matches the
          # rest of the repo's checkout posture (rust matrix +
          # codeql).
          persist-credentials: false

      - name: Install Bun
        # Pinned to the v2.2.0 commit SHA. `pull_request` runs with a
        # read-only token but CodeQL's actions/unpinned-tag rule
        # treats every third-party action as supply-chain surface, so
        # we use the same hash-pinned posture the rest of the repo's
        # workflows already follow.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        # `--frozen-lockfile` makes a CI bun.lock drift fail loud
        # instead of silently regenerating against the registry.
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: Build
        # Runs first so the TanStack Router plugin can regenerate
        # `src/routeTree.gen.ts` (which is gitignored). The typecheck
        # step below imports it; without a prior build it would 404.
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # `vitest run` is configured in package.json — no watch mode
        # so it exits cleanly under the runner.
        run: bun run test
