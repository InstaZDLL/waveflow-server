    <text x="293" y="96.5" fill="#A5B2BC" font-size="15" font-weight="650" letter-spacing="1.8">SERVER</text>

    <text x="80" y="232" fill="#F8FAFC" font-size="70" font-weight="760" letter-spacing="-3.5">Self-hosted</text>
    <text x="80" y="307" fill="url(#accent)" font-size="70" font-weight="760" letter-spacing="-3.5">music server.</text>

    <text x="80" y="364" fill="#A5B2BC" font-size="22" font-weight="400" letter-spacing="-0.3">
      <tspan x="80" dy="0">Your library, your server, your rules.</tspan>
      <tspan x="80" dy="35">Fast, private, and OpenSubsonic compatible.</tspan>
    </text>

    <g transform="translate(80 460)">
      <g>
        <rect width="164" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <circle cx="22" cy="23" r="5" fill="#34D399"/>
        <text x="37" y="29" fill="#DDE7E5" font-size="14" font-weight="650" letter-spacing="0.35">RUST + SQLITE</text>
      </g>
      <g transform="translate(176 0)">
        <rect width="176" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <path d="M18 23l5 5 10-11" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="43" y="29" fill="#DDE7E5" font-size="14" font-weight="650" letter-spacing="0.35">SINGLE BINARY</text>
      </g>
      <g transform="translate(364 0)">
        <rect width="178" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <path d="M18 23a7 7 0 0 1 7-7h2.5a5.5 5.5 0 1 1 0 11H25a7 7 0 0 1-7-7" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
        <text x="43" y="29" fill="#DDE7E5" font-size="14" font-weight="650" letter-spacing="0.35">OPENSUBSONIC</text>
      </g>
    </g>

    <text x="80" y="574" fill="#65736F" font-size="14" font-weight="600" letter-spacing="1.2">OPEN SOURCE · AGPL-3.0</text>
  </g>

  <!-- Enlarged server/player panel closes the central gap. -->
  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="690" y="65" width="510" height="510" rx="34" fill="#0A1118" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="691" y="66" width="508" height="508" rx="33" fill="url(#glass)"/>

    <g transform="translate(728 99)">
      <circle cx="7" cy="7" r="4" fill="#34D399"/>
      <text x="22" y="12" fill="#C7D2D9" font-size="14" font-weight="650">waveflow.local</text>
      <rect x="365" width="78" height="25" rx="12.5" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.22"/>
      <circle cx="380" cy="12.5" r="3.5" fill="#34D399"/>
      <text x="390" y="17" fill="#75E1B7" font-size="11" font-weight="700" letter-spacing="0.6">ONLINE</text>
    </g>

    <g clip-path="url(#cover-clip)">
      <rect x="735" y="151" width="420" height="220" fill="url(#cover)"/>
      <circle cx="1130" cy="158" r="175" fill="#38BDF8" fill-opacity="0.09"/>
      <circle cx="746" cy="375" r="150" fill="#34D399" fill-opacity="0.12"/>
      <path d="M735 310C810 266 856 291 923 316C1000 345 1060 324 1155 255V371H735Z" fill="#FFFFFF" fill-opacity="0.035"/>
