    <text x="735" y="419" fill="#F3F7F8" font-size="25" font-weight="720" letter-spacing="-0.5">Your music library</text>
    <text x="735" y="447" fill="#71808B" font-size="15" font-weight="500">Streaming from your own server</text>

    <rect x="735" y="477" width="420" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="735" y="477" width="274" height="6" rx="3" fill="url(#accent)"/>
    <circle cx="1009" cy="480" r="6.5" fill="#A7F3D0" stroke="#10221E" stroke-width="3"/>

    <g transform="translate(735 514)">
      <circle cx="18" cy="18" r="18" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <path d="M15 12L25 18L15 24Z" fill="#CBD5E1"/>
      <text x="51" y="14" fill="#71808B" font-size="11" font-weight="700" letter-spacing="1">NOW PLAYING</text>
      <text x="51" y="34" fill="#C7D2D9" font-size="14" font-weight="600">Anywhere you listen</text>
    </g>
  </g>

  <g transform="translate(645 226)" filter="url(#soft-shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect width="142" height="70" rx="18" fill="#101922" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="26" cy="26" r="10" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.36"/>
    <path d="M22 26h8M26 22v8" stroke="#7DD3FC" stroke-width="1.7" stroke-linecap="round"/>
    <text x="45" y="30" fill="#D8E2E8" font-size="12" font-weight="700">API ready</text>
    <text x="19" y="54" fill="#687984" font-size="10" font-weight="600" letter-spacing="0.6">OPENSUBSONIC</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#FFFFFF" stroke-opacity="0.055"/>
</svg>
